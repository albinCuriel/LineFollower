# Compileert bij elke push alle sketches voor de ESP32-S3 (bewijs dat de code bouwt).
name: compileer firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  esp32s3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32s3
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
              version: 3.3.12
          libraries: |
            - source-path: ./code/lib/lf_core
            - source-path: ./code/lib/lf_esp32
          sketch-paths: |
            - code/proof of concepts/blink/poc_blink
            - code/basis/basis
            - code/finaal/linefollower
            - code/proof of concepts/sensor/poc_sensor
            - code/proof of concepts/hbridge/poc_hbridge
            - code/proof of concepts/interrupt/poc_interrupt
            - code/proof of concepts/wireless communication/poc_wifi
          enable-deltas-report: false
